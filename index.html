<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#FEFCF1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Bắt lời mời cài PWA càng sớm càng tốt để nút Cài App không bỏ lỡ sự kiện của Chromium.
    window.__class1InstallPrompt = null;
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      window.__class1InstallPrompt = event;
      window.dispatchEvent(new Event("class1-install-ready"));
    });
    window.addEventListener("appinstalled", () => {
      window.__class1InstallPrompt = null;
    });
  </script>
  <link rel="manifest" href="manifest.json?v=class1-core-8">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Lớp 1 - Cô Thỏ Hồng | Epsilon Edu</title>
  <style>
    :root{
      --page:#FEFCF1;
      --white:#FFFFFF;
      --ink:#344054;
      --muted:#667085;
      --pink:#EC4899;
      --pink-2:#F472B6;
      --purple:#8B5CF6;
      --purple-2:#7C3AED;
      --blue:#3B82F6;
      --sky:#38BDF8;
      --green:#10B981;
      --teal:#14B8A6;
      --amber:#F59E0B;
      --red:#F43F5E;
      --brand:#173A78;
      --line:#EDE9FE;
      --shadow:0 7px 18px rgba(76,29,149,.10);
      --radius:18px;
      --app-width:82rem;
    }

    *{box-sizing:border-box}
    html{background:var(--page);scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:var(--page);
      color:var(--ink);
      font-family:"Nunito","Segoe UI",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button,input{font:inherit}
    button{cursor:pointer}
    img{max-width:100%}
    .hidden{display:none!important}

    .app-shell{
      width:min(100%,var(--app-width));
      margin:0 auto;
      padding:0 .5rem max(.25rem,env(safe-area-inset-bottom));
      background:var(--page);
    }

    .app-header{
      display:grid;
      grid-template-columns:112px minmax(0,1fr) auto;
      align-items:stretch;
      gap:.55rem;
      padding:.45rem 0;
      position:relative;
      z-index:20;
      background:var(--page);
    }

    .home-btn{
      width:112px;
      height:74px;
      border:1px solid #E9D5FF;
      border-radius:17px;
      padding:0;
      overflow:hidden;
      background:#fff;
      box-shadow:var(--shadow);
      transition:transform .18s ease, box-shadow .18s ease;
    }
    .home-btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(139,92,246,.18)}
    .home-btn img{width:100%;height:100%;object-fit:cover;display:block}

    .primary-nav{
      min-width:0;
      display:grid;
      grid-auto-flow:column;
      grid-auto-columns:minmax(96px,1fr);
      gap:.45rem;
      overflow-x:auto;
      scrollbar-width:none;
      align-items:stretch;
    }
    .primary-nav::-webkit-scrollbar{display:none}

    .nav-tab{
      position:relative;
      min-width:0;
      min-height:74px;
      padding:.5rem .42rem;
      border:1px solid;
      border-radius:17px;
      box-shadow:0 3px 10px rgba(15,23,42,.05);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:.22rem;
      font-weight:900;
      font-size:16px;
      line-height:1.08;
      text-align:center;
      transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
      white-space:normal;
    }
    .nav-tab:hover{transform:translateY(-1px);filter:brightness(1.01);box-shadow:0 7px 17px rgba(76,29,149,.10)}
    .nav-tab .tab-icon{font-size:22px;line-height:1}
    .nav-tab::after{
      content:"";
      position:absolute;
      left:30%;right:30%;bottom:-5px;height:3px;border-radius:99px;
      background:currentColor;opacity:0;transform:scaleX(.5);transition:.16s ease;
    }
    .nav-tab.is-active::after{opacity:1;transform:scaleX(1)}
    .nav-tab.is-active{color:white!important;border-color:transparent!important}
    .nav-tab.is-locked:not(.is-active)::before{content:"🔒";position:absolute;right:7px;top:6px;font-size:16px;opacity:.72}
    .nav-alert-badge{position:absolute;right:6px;top:5px;min-width:23px;height:23px;padding:0 6px;border-radius:999px;background:#EF4444;color:#fff;border:2px solid #fff;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:950;line-height:1;box-shadow:0 3px 8px rgba(239,68,68,.28);z-index:2}
    .nav-tab.is-active .nav-alert-badge{background:#fff;color:#DC2626;border-color:rgba(255,255,255,.75)}
    .nav-ai-badge{
      position:absolute;right:6px;top:5px;min-width:30px;height:21px;padding:0 7px;border-radius:999px;
      display:inline-flex;align-items:center;justify-content:center;
      border:1px solid rgba(255,255,255,.92);
      background:linear-gradient(90deg,#EC4899 0%,#8B5CF6 52%,#3B82F6 100%);
      color:#fff;font-size:11px;font-weight:950;line-height:1;letter-spacing:.03em;
      box-shadow:0 3px 8px rgba(99,102,241,.22);z-index:2;pointer-events:none;
    }
    .nav-tab.is-active .nav-ai-badge{
      background:#fff;color:#2563EB;border-color:rgba(255,255,255,.95);box-shadow:0 3px 8px rgba(30,64,175,.16);
    }

    .tone-purple{background:#F3E8FF;color:#7C3AED;border-color:#DDD6FE}
    .tone-purple.is-active{background:linear-gradient(90deg,#A855F7,#7C3AED)}
    .tone-pink{background:#FCE7F3;color:#DB2777;border-color:#FBCFE8}
    .tone-pink.is-active{background:linear-gradient(90deg,#F472B6,#EC4899)}
    .tone-blue{background:#E0F2FE;color:#0369A1;border-color:#BAE6FD}
    .tone-blue.is-active{background:linear-gradient(90deg,#38BDF8,#0284C7)}
    .tone-amber{background:#FEF3C7;color:#B45309;border-color:#FDE68A}
    .tone-amber.is-active{background:linear-gradient(90deg,#FBBF24,#F59E0B)}
    .tone-green{background:#DCFCE7;color:#15803D;border-color:#BBF7D0}
    .tone-green.is-active{background:linear-gradient(90deg,#4ADE80,#16A34A)}
    .tone-indigo{background:#EDE9FE;color:#6D28D9;border-color:#DDD6FE}
    .tone-indigo.is-active{background:linear-gradient(90deg,#8B5CF6,#6D28D9)}

    .header-tools{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:.4rem;
    }
    .tool-btn{
      height:42px;
      border:1px solid #E9D5FF;
      background:#fff;
      color:#6D28D9;
      border-radius:14px;
      box-shadow:0 3px 9px rgba(76,29,149,.07);
      font-weight:900;
      padding:0 .7rem;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:.35rem;
      white-space:nowrap;
    }
    .tool-btn:not(.install-btn):hover{background:#FAF5FF}
    .install-btn{
      color:white;
      border:0;
      background:linear-gradient(90deg,var(--pink),var(--purple));
      min-width:86px;
      transition:filter .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .install-btn:hover{
      color:white;
      background:linear-gradient(90deg,var(--pink),var(--purple));
      filter:brightness(1.12) saturate(1.08);
      box-shadow:0 6px 16px rgba(168,85,247,.28);
      transform:translateY(-1px);
    }
    .user-btn{
      position:relative;
      width:auto;
      min-width:96px;
      max-width:180px;
      height:74px;
      padding:.42rem .68rem;
      border-radius:17px;
      flex-direction:column;
      gap:.18rem;
      background:#FAF5FF;
      color:#7C3AED;
      border-color:#DDD6FE;
      line-height:1.05;
      overflow:hidden;
    }
    .user-btn:hover{background:#F3E8FF!important;transform:translateY(-1px);box-shadow:0 7px 17px rgba(76,29,149,.10)}
    .user-btn.is-guest-auth{justify-content:center;gap:0;padding-top:.45rem;padding-bottom:.45rem}
    .guest-auth-label{font-size:16px!important;line-height:1.18!important;font-weight:950!important}
    .guest-auth-line{display:block;width:100%}
    .user-btn-avatar{display:block;font-size:30px;line-height:1;flex:0 0 auto}
    .user-btn-name{
      display:block;
      width:100%;
      max-width:100%;
      overflow:visible;
      text-overflow:clip;
      white-space:normal;
      overflow-wrap:anywhere;
      font-size:16px;
      font-weight:950;
      color:currentColor;
      text-align:center;
    }
    .user-notice-badge{position:absolute;top:5px;right:5px;min-width:23px;height:23px;padding:0 6px;border-radius:999px;background:#EF4444;color:#fff;border:2px solid #fff;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:950;line-height:1;box-shadow:0 3px 8px rgba(239,68,68,.28);z-index:3;pointer-events:none}
    .user-btn-role-badge{
      position:absolute;
      top:5px;
      right:5px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:14px;
      padding:1px 4px;
      border:1px solid #F9A8D4;
      border-radius:999px;
      background:#FDF2F8;
      color:#DB2777;
      font-size:10px;
      font-weight:900;
      line-height:1;
      letter-spacing:0;
      box-shadow:0 1px 3px rgba(219,39,119,.07);
      pointer-events:none;
    }
    .score-box{
      height:50px;
      padding:.24rem .54rem;
      border:1px solid #FBCFE8;
      border-radius:17px;
      background:#FFF7FB;
      display:grid;
      grid-template-columns:auto auto;
      gap:.06rem .5rem;
      align-content:center;
      box-shadow:0 3px 9px rgba(236,72,153,.06);
      font-size:16px;
      font-weight:900;
    }
    .score-box .good{color:#059669}
    .score-box .bad{color:#E11D48}
    .score-box strong{font-size:16px}

    .banner-slot{width:100%;position:relative}
    .main-banner{
      width:100%;
      aspect-ratio:5.5/1;
      overflow:hidden;
      background:#EAF8FF;
    }
    .main-banner picture,.main-banner img{width:100%;height:100%;display:block}
    .main-banner img{object-fit:cover}

    .sub-banner{
      width:100%;
      aspect-ratio:15/1;
      position:relative;
      overflow:hidden;
      background:url("banner-sub.jpg") center/cover no-repeat;
      display:flex;
      align-items:center;
      padding:0 1.25rem;
    }
    .sub-pill{
      position:relative;
      z-index:1;
      min-width:200px;
      max-width:46%;
      min-height:38px;
      padding:.48rem 1rem;
      border-radius:999px;
      border:1px solid rgba(244,114,182,.42);
      background:rgba(255,255,255,.84);
      backdrop-filter:blur(5px);
      box-shadow:0 4px 14px rgba(76,29,149,.10);
      color:#BE185D;
      font-weight:900;
      font-size:16px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .content-stage{
      position:relative;
      z-index:3;
      min-height:340px;
      padding:1rem .1rem 2.2rem;
      background:var(--page);
    }


    .home-vip-notice{
      width:max-content;
      max-width:calc(100% - 1rem);
      margin:.72rem auto .12rem;
      padding:.62rem 1.2rem .66rem;
      border:1.5px solid #C4B5FD;
      border-radius:17px;
      background:linear-gradient(90deg,#FFF1F7 0%,#FAF5FF 52%,#EFF8FF 100%);
      box-shadow:0 5px 14px rgba(124,58,237,.09);
      color:#7C3AED;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:.16rem;
      text-align:center;
      line-height:1.3;
      cursor:default;
      user-select:text;
      -webkit-user-select:text;
    }
    .home-vip-notice-title{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:.55rem;
      color:#7C3AED;
      font-size:17px;
      font-weight:950;
      text-align:center;
    }
    .home-vip-notice-deco{
      flex:0 0 auto;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      letter-spacing:.04em;
      white-space:nowrap;
    }
    .home-vip-notice-copy{
      display:block;
      color:#6D28D9;
      font-size:16px;
      font-weight:850;
    }


    /* Trang Liên hệ */
    .contact-page{
      max-width:980px;
      margin:0 auto;
      display:grid;
      gap:.9rem;
    }
    .contact-subtabs{
      width:min(100%,900px);
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:.68rem;
      padding:0;
      border:0;
      border-radius:0;
      background:transparent;
      box-shadow:none;
    }
    .contact-subtab{
      min-height:50px;
      border:1.5px solid;
      border-radius:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:.42rem;
      padding:.55rem .78rem;
      font-size:17px;
      line-height:1.15;
      font-weight:950;
      box-shadow:0 4px 11px rgba(76,29,149,.055);
      transition:transform .15s ease,box-shadow .15s ease,filter .15s ease,border-color .15s ease;
    }
    .contact-subtab:nth-child(1){background:#FFF1F7;border-color:#F9A8D4;color:#BE185D}
    .contact-subtab:nth-child(2){background:#F5F3FF;border-color:#C4B5FD;color:#6D28D9}
    .contact-subtab:nth-child(3){background:#EFF8FF;border-color:#7DD3FC;color:#0369A1}
    .contact-subtab:hover{transform:translateY(-1px);filter:brightness(1.015);box-shadow:0 7px 16px rgba(76,29,149,.10)}
    .contact-subtab.is-active{
      border-width:2px;
      box-shadow:0 0 0 3px rgba(139,92,246,.10),0 7px 17px rgba(76,29,149,.10);
      transform:translateY(-1px);
    }
    .contact-subtab:nth-child(1).is-active{background:#FCE7F3;border-color:#EC4899;color:#BE185D}
    .contact-subtab:nth-child(2).is-active{background:#EDE9FE;border-color:#8B5CF6;color:#6D28D9}
    .contact-subtab:nth-child(3).is-active{background:#E0F2FE;border-color:#38BDF8;color:#0369A1}
    .contact-panel{display:grid;gap:.9rem}
    .contact-intro-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:.7rem;
    }
    .contact-intro-card{
      min-height:142px;
      padding:.9rem;
      border:1px solid;
      border-radius:19px;
      display:flex;
      align-items:flex-start;
      gap:.7rem;
      box-shadow:0 5px 14px rgba(15,23,42,.045);
    }
    .contact-intro-card.tone-purple{background:#FAF5FF;border-color:#D8B4FE;color:#6D28D9}
    .contact-intro-card.tone-pink{background:#FFF1F7;border-color:#F9A8D4;color:#BE185D}
    .contact-intro-card.tone-blue{background:#EFF8FF;border-color:#BAE6FD;color:#0369A1}
    .contact-intro-icon{
      width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.86);font-size:23px;box-shadow:0 3px 8px rgba(76,29,149,.05);
    }
    .contact-intro-card strong{display:block;color:currentColor;font-size:18px;line-height:1.24;font-weight:950}
    .contact-intro-card span:not(.contact-intro-icon){display:block;margin-top:.34rem;color:#667085;font-size:16px;line-height:1.48;font-weight:750}
    button.contact-intro-card{width:100%;font:inherit;text-align:left;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}
    button.contact-intro-card:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(76,29,149,.10);filter:brightness(1.015)}
    .contact-experience-head{display:flex;align-items:flex-end;justify-content:space-between;gap:.75rem;margin-top:.08rem}
    .contact-experience-head h3{margin:0;color:#5B216E;font-size:22px;font-weight:950}
    .contact-experience-head p{margin:.2rem 0 0;color:#667085;font-size:16px;line-height:1.48;font-weight:750}
    .contact-experience-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.72rem}
    .contact-experience-card{min-height:154px;padding:1rem;border:1.5px solid;border-radius:20px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:.82rem;text-align:left;font:inherit;box-shadow:0 5px 14px rgba(15,23,42,.05);transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}
    .contact-experience-card:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(76,29,149,.11);filter:brightness(1.012)}
    .contact-experience-card.games{background:linear-gradient(135deg,#F5F3FF,#FFF1F7);border-color:#C4B5FD;color:#6D28D9}
    .contact-experience-card.tools{background:linear-gradient(135deg,#ECFDF5,#EFF8FF);border-color:#86EFAC;color:#047857}
    .contact-experience-icon{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.88);font-size:29px;box-shadow:0 4px 10px rgba(76,29,149,.06)}
    .contact-experience-copy strong{display:block;color:currentColor;font-size:21px;line-height:1.2;font-weight:950}
    .contact-experience-copy span{display:block;margin-top:.34rem;color:#475467;font-size:16px;line-height:1.48;font-weight:750}
    .contact-experience-go{min-width:30px;height:30px;padding:0 .5rem;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#fff;color:currentColor;font-size:16px;font-weight:950;box-shadow:0 3px 8px rgba(76,29,149,.08)}
    .contact-ee-section{padding:.9rem;border:1px solid #BAE6FD;border-radius:20px;background:linear-gradient(135deg,#F0F9FF,#FAF5FF);box-shadow:0 5px 14px rgba(15,23,42,.045)}
    .contact-ee-section h3{margin:0;color:#0369A1;font-size:22px;font-weight:950}
    .contact-ee-section p{margin:.34rem 0 0;color:#667085;font-size:16px;line-height:1.48;font-weight:750}
    .contact-grade-links{display:flex;flex-wrap:wrap;gap:.48rem;margin-top:.72rem}
    .contact-grade-link{min-height:40px;padding:.46rem .78rem;border:1px solid #BAE6FD;border-radius:12px;background:#fff;color:#0369A1;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.3rem;font-size:16px;font-weight:950;box-shadow:0 3px 8px rgba(14,165,233,.06);transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
    .contact-grade-link:hover{transform:translateY(-1px);background:#EFF8FF;box-shadow:0 5px 12px rgba(14,165,233,.10)}
    .contact-grade-link.is-current{border-color:#C4B5FD;background:#F5F3FF;color:#6D28D9}
    .contact-grade-link.is-unavailable{border-style:dashed;border-color:#CBD5E1;background:#F8FAFC;color:#94A3B8;cursor:default;box-shadow:none}
    .contact-hero{
      display:grid;
      grid-template-columns:72px minmax(0,1fr);
      align-items:center;
      gap:.9rem;
      padding:1rem 1.08rem;
      border:1px solid #DDD6FE;
      border-radius:22px;
      background:linear-gradient(135deg,#FFF7FB 0%,#FAF5FF 48%,#F0F9FF 100%);
      box-shadow:0 7px 18px rgba(76,29,149,.07);
    }
    .contact-hero-icon{
      width:72px;
      height:72px;
      border-radius:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
      border:1px solid #E9D5FF;
      box-shadow:0 5px 13px rgba(76,29,149,.08);
      font-size:39px;
    }
    .contact-hero-copy h2{
      margin:0;
      color:#6D28D9;
      font-size:24px;
      line-height:1.15;
      font-weight:950;
    }
    .contact-hero-copy p{
      margin:.32rem 0 0;
      color:#667085;
      font-size:16px;
      line-height:1.45;
      font-weight:750;
    }
    .contact-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:.78rem;
    }
    .contact-card{
      min-width:0;
      min-height:148px;
      padding:1rem;
      border:1.5px solid;
      border-radius:20px;
      display:grid;
      grid-template-columns:54px minmax(0,1fr) 34px;
      align-items:center;
      gap:.8rem;
      text-decoration:none;
      box-shadow:0 5px 14px rgba(15,23,42,.05);
      transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;
    }
    .contact-card:hover{
      transform:translateY(-2px);
      box-shadow:0 9px 22px rgba(76,29,149,.11);
      filter:brightness(1.012);
    }
    .contact-card:focus-visible{outline:3px solid rgba(59,130,246,.22);outline-offset:2px}
    .contact-card.email{background:#FFF1F7;border-color:#F9A8D4;color:#BE185D}
    .contact-card.zalo{background:#EFF8FF;border-color:#7DD3FC;color:#0369A1}
    .contact-card-icon{
      width:54px;
      height:54px;
      border-radius:17px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.86);
      border:1px solid rgba(255,255,255,.92);

    /* Nền tổng Lớp 1 hòa với vùng trống của ảnh footer.

  <div class="app-shell">

      <nav id="primary-nav" class="primary-nav" aria-label="Các tab chính"></nav>

      <div class="header-tools">
        <button id="install-button" class="tool-btn install-btn hidden" type="button">Cài App</button>
        <div id="score-box" class="score-box hidden" aria-label="Thống kê đúng sai">
          <span class="good">★ Đúng</span><strong class="good">0</strong>
          <span class="bad">★ Sai</span><strong class="bad">0</strong>
        </div>
        <button id="account-button" class="tool-btn user-btn is-guest-auth" type="button" title="Đăng ký hoặc Đăng nhập" aria-label="Đăng ký hoặc Đăng nhập"><span class="user-btn-name guest-auth-label"><span class="guest-auth-line">Đăng ký</span><span class="guest-auth-line">Đăng nhập</span></span></button>

          <img src="banner-main.jpg" alt="Lớp 1 - Cô Thỏ Hồng">
        </picture>
      </div>

    </section>

        <button id="auth-tab-register" class="auth-tab" type="button">Đăng ký tài khoản</button>

      <form id="login-form" class="form-stack" novalidate>

          <label for="login-id">Mã ID</label>
          <input id="login-id" name="login-id" autocomplete="username" placeholder="Ví dụ: L1-A001">
        </div>
        <div class="field">
          <label for="login-password">Mật khẩu</label>
          <input id="login-password" name="login-password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu">
        </div>
        <button id="login-submit" class="primary-action" type="submit">Đăng nhập</button>
      </form>

      <form id="register-form" class="form-stack hidden" novalidate>
        <div class="field">
          <label for="register-name">Họ và tên học sinh</label>

        </div>
        <div class="field">
          <label for="register-confirm">Nhập lại mật khẩu <span aria-hidden="true">*</span></label>
          <input id="register-confirm" name="register-confirm" type="password" minlength="6" autocomplete="new-password" placeholder="Nhập lại mật khẩu">
        </div>
        <button id="register-submit" class="primary-action" type="submit">Đăng ký ngay</button>
      </form>

      <div class="auth-divider"></div>
      <button id="auth-later" class="secondary-action" type="button">Để sau nhé</button>

  <div id="app-dialog" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="dialog-title">

      <div id="dialog-icon" class="dialog-icon">🐰</div>

      <div class="dialog-actions">

        <button id="dialog-ok" class="primary-action" type="button">OK</button>
