<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#FEFCF1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Bắt lời mời cài PWA càng sớm càng tốt để nút Cài App không bỏ lỡ sự kiện của Chromium.
    window.__class1InstallPrompt = null;
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      window.__class1InstallPrompt = event;
      window.dispatchEvent(new Event("class1-install-ready"));
    });
    window.addEventListener("appinstalled", () => {
      window.__class1InstallPrompt = null;
    });
  </script>
  <link rel="manifest" href="manifest.json?v=class1-core-8">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Lớp 1 - Cô Thỏ Hồng | Epsilon Edu</title>
  <style>
    :root{
      --page:#FEFCF1;
      --white:#FFFFFF;
      --ink:#344054;
      --muted:#667085;
      --pink:#EC4899;
      --pink-2:#F472B6;
      --purple:#8B5CF6;
      --purple-2:#7C3AED;
      --blue:#3B82F6;
      --sky:#38BDF8;
      --green:#10B981;
      --teal:#14B8A6;
      --amber:#F59E0B;
      --red:#F43F5E;
      --brand:#173A78;
      --line:#EDE9FE;
      --shadow:0 7px 18px rgba(76,29,149,.10);
      --radius:18px;
      --app-width:82rem;
    }

    *{box-sizing:border-box}
    html{background:var(--page);scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:var(--page);
      color:var(--ink);
      font-family:"Nunito","Segoe UI",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button,input{font:inherit}
    button{cursor:pointer}
    img{max-width:100%}
    .hidden{display:none!important}

    .app-shell{
      width:min(100%,var(--app-width));
      margin:0 auto;
      padding:0 .5rem max(.25rem,env(safe-area-inset-bottom));
      background:var(--page);
    }

    .app-header{
      display:grid;
      grid-template-columns:112px minmax(0,1fr) auto;
      align-items:stretch;
      gap:.55rem;
      padding:.45rem 0;
      position:relative;
      z-index:20;
      background:var(--page);
    }

    .home-btn{
      width:112px;
      height:74px;
      border:1px solid #E9D5FF;
      border-radius:17px;
      padding:0;
      overflow:hidden;
      background:#fff;
      box-shadow:var(--shadow);
      transition:transform .18s ease, box-shadow .18s ease;
    }
    .home-btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(139,92,246,.18)}
    .home-btn img{width:100%;height:100%;object-fit:cover;display:block}

    .primary-nav{
      min-width:0;
      display:grid;
      grid-auto-flow:column;
      grid-auto-columns:minmax(96px,1fr);
      gap:.45rem;
      overflow-x:auto;
      scrollbar-width:none;
      align-items:stretch;
    }
    .primary-nav::-webkit-scrollbar{display:none}

    .nav-tab{
      position:relative;
      min-width:0;
      min-height:74px;
      padding:.5rem .42rem;
      border:1px solid;
      border-radius:17px;
      box-shadow:0 3px 10px rgba(15,23,42,.05);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:.22rem;
      font-weight:900;
      font-size:16px;
      line-height:1.08;
      text-align:center;
      transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
      white-space:normal;
    }
    .nav-tab:hover{transform:translateY(-1px);filter:brightness(1.01);box-shadow:0 7px 17px rgba(76,29,149,.10)}
    .nav-tab .tab-icon{font-size:22px;line-height:1}
    .nav-tab::after{
      content:"";
      position:absolute;
      left:30%;right:30%;bottom:-5px;height:3px;border-radius:99px;
      background:currentColor;opacity:0;transform:scaleX(.5);transition:.16s ease;
    }
    .nav-tab.is-active::after{opacity:1;transform:scaleX(1)}
    .nav-tab.is-active{color:white!important;border-color:transparent!important}
    .nav-tab.is-locked:not(.is-active)::before{content:"🔒";position:absolute;right:7px;top:6px;font-size:16px;opacity:.72}
    .nav-alert-badge{position:absolute;right:6px;top:5px;min-width:23px;height:23px;padding:0 6px;border-radius:999px;background:#EF4444;color:#fff;border:2px solid #fff;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:950;line-height:1;box-shadow:0 3px 8px rgba(239,68,68,.28);z-index:2}
    .nav-tab.is-active .nav-alert-badge{background:#fff;color:#DC2626;border-color:rgba(255,255,255,.75)}
    .nav-ai-badge{
      position:absolute;right:6px;top:5px;min-width:30px;height:21px;padding:0 7px;border-radius:999px;
      display:inline-flex;align-items:center;justify-content:center;
      border:1px solid rgba(255,255,255,.92);
      background:linear-gradient(90deg,#EC4899 0%,#8B5CF6 52%,#3B82F6 100%);
      color:#fff;font-size:11px;font-weight:950;line-height:1;letter-spacing:.03em;
      box-shadow:0 3px 8px rgba(99,102,241,.22);z-index:2;pointer-events:none;
    }
    .nav-tab.is-active .nav-ai-badge{
      background:#fff;color:#2563EB;border-color:rgba(255,255,255,.95);box-shadow:0 3px 8px rgba(30,64,175,.16);
    }

    .tone-purple{background:#F3E8FF;color:#7C3AED;border-color:#DDD6FE}
    .tone-purple.is-active{background:linear-gradient(90deg,#A855F7,#7C3AED)}
    .tone-pink{background:#FCE7F3;color:#DB2777;border-color:#FBCFE8}
    .tone-pink.is-active{background:linear-gradient(90deg,#F472B6,#EC4899)}
    .tone-blue{background:#E0F2FE;color:#0369A1;border-color:#BAE6FD}
    .tone-blue.is-active{background:linear-gradient(90deg,#38BDF8,#0284C7)}
    .tone-amber{background:#FEF3C7;color:#B45309;border-color:#FDE68A}
    .tone-amber.is-active{background:linear-gradient(90deg,#FBBF24,#F59E0B)}
    .tone-green{background:#DCFCE7;color:#15803D;border-color:#BBF7D0}
    .tone-green.is-active{background:linear-gradient(90deg,#4ADE80,#16A34A)}
    .tone-indigo{background:#EDE9FE;color:#6D28D9;border-color:#DDD6FE}
    .tone-indigo.is-active{background:linear-gradient(90deg,#8B5CF6,#6D28D9)}

    .header-tools{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:.4rem;
    }
    .tool-btn{
      height:42px;
      border:1px solid #E9D5FF;
      background:#fff;
      color:#6D28D9;
      border-radius:14px;
      box-shadow:0 3px 9px rgba(76,29,149,.07);
      font-weight:900;
      padding:0 .7rem;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:.35rem;
      white-space:nowrap;
    }
    .tool-btn:not(.install-btn):hover{background:#FAF5FF}
    .install-btn{
      color:white;
      border:0;
      background:linear-gradient(90deg,var(--pink),var(--purple));
      min-width:86px;
      transition:filter .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .install-btn:hover{
      color:white;
      background:linear-gradient(90deg,var(--pink),var(--purple));
      filter:brightness(1.12) saturate(1.08);
      box-shadow:0 6px 16px rgba(168,85,247,.28);
      transform:translateY(-1px);
    }
    .user-btn{
      position:relative;
      width:auto;
      min-width:96px;
      max-width:180px;
      height:74px;
      padding:.42rem .68rem;
      border-radius:17px;
      flex-direction:column;
      gap:.18rem;
      background:#FAF5FF;
      color:#7C3AED;
      border-color:#DDD6FE;
      line-height:1.05;
      overflow:hidden;
    }
    .user-btn:hover{background:#F3E8FF!important;transform:translateY(-1px);box-shadow:0 7px 17px rgba(76,29,149,.10)}
    .user-btn.is-guest-auth{justify-content:center;gap:0;padding-top:.45rem;padding-bottom:.45rem}
    .guest-auth-label{font-size:16px!important;line-height:1.18!important;font-weight:950!important}
    .guest-auth-line{display:block;width:100%}
    .user-btn-avatar{display:block;font-size:30px;line-height:1;flex:0 0 auto}
    .user-btn-name{
      display:block;
      width:100%;
      max-width:100%;
      overflow:visible;
      text-overflow:clip;
      white-space:normal;
      overflow-wrap:anywhere;
      font-size:16px;
      font-weight:950;
      color:currentColor;
      text-align:center;
    }
    .user-notice-badge{position:absolute;top:5px;right:5px;min-width:23px;height:23px;padding:0 6px;border-radius:999px;background:#EF4444;color:#fff;border:2px solid #fff;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:950;line-height:1;box-shadow:0 3px 8px rgba(239,68,68,.28);z-index:3;pointer-events:none}
    .user-btn-role-badge{
      position:absolute;
      top:5px;
      right:5px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:14px;
      padding:1px 4px;
      border:1px solid #F9A8D4;
      border-radius:999px;
      background:#FDF2F8;
      color:#DB2777;
      font-size:10px;
      font-weight:900;
      line-height:1;
      letter-spacing:0;
      box-shadow:0 1px 3px rgba(219,39,119,.07);
      pointer-events:none;
    }
    .score-box{
      height:50px;
      padding:.24rem .54rem;
      border:1px solid #FBCFE8;
      border-radius:17px;
      background:#FFF7FB;
      display:grid;
      grid-template-columns:auto auto;
      gap:.06rem .5rem;
      align-content:center;
      box-shadow:0 3px 9px rgba(236,72,153,.06);
      font-size:16px;
      font-weight:900;
    }
    .score-box .good{color:#059669}
    .score-box .bad{color:#E11D48}
    .score-box strong{font-size:16px}

    .banner-slot{width:100%;position:relative}
    .main-banner{
      width:100%;
      aspect-ratio:5.5/1;
      overflow:hidden;
      background:#EAF8FF;
    }
    .main-banner picture,.main-banner img{width:100%;height:100%;display:block}
    .main-banner img{object-fit:cover}

    .sub-banner{
      width:100%;
      aspect-ratio:15/1;
      position:relative;
      overflow:hidden;
      background:url("banner-sub.jpg") center/cover no-repeat;
      display:flex;
      align-items:center;
      padding:0 1.25rem;
    }
    .sub-pill{
      position:relative;
      z-index:1;
      min-width:200px;
      max-width:46%;
      min-height:38px;
      padding:.48rem 1rem;
      border-radius:999px;
      border:1px solid rgba(244,114,182,.42);
      background:rgba(255,255,255,.84);
      backdrop-filter:blur(5px);
      box-shadow:0 4px 14px rgba(76,29,149,.10);
      color:#BE185D;
      font-weight:900;
      font-size:16px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .content-stage{
      position:relative;
      z-index:3;
      min-height:340px;
      padding:1rem .1rem 2.2rem;
      background:var(--page);
    }


    .home-vip-notice{
      width:max-content;
      max-width:calc(100% - 1rem);
      margin:.72rem auto .12rem;
      padding:.62rem 1.2rem .66rem;
      border:1.5px solid #C4B5FD;
      border-radius:17px;
      background:linear-gradient(90deg,#FFF1F7 0%,#FAF5FF 52%,#EFF8FF 100%);
      box-shadow:0 5px 14px rgba(124,58,237,.09);
      color:#7C3AED;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:.16rem;
      text-align:center;
      line-height:1.3;
      cursor:default;
      user-select:text;
      -webkit-user-select:text;
    }
    .home-vip-notice-title{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:.55rem;
      color:#7C3AED;
      font-size:17px;
      font-weight:950;
      text-align:center;
    }
    .home-vip-notice-deco{
      flex:0 0 auto;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      letter-spacing:.04em;
      white-space:nowrap;
    }
    .home-vip-notice-copy{
      display:block;
      color:#6D28D9;
      font-size:16px;
      font-weight:850;
    }



    /* Games / Tools / AI Lab: thông báo VIP theo số môn (chỉ UI, không khóa truy cập). */
    .feature-vip-notice{
      width:100%;
      margin:.72rem auto .12rem;
      display:flex;
      flex-wrap:wrap;
      align-items:stretch;
      justify-content:center;
      gap:.65rem;
    }
    .feature-vip-notice-message{
      flex:1 1 470px;
      min-width:0;
      min-height:49px;
      padding:.65rem 1rem;
      border:1px solid #C4B5FD;
      border-radius:16px;
      background:linear-gradient(90deg,#FFF1F7 0%,#FAF5FF 52%,#EFF8FF 100%);
      box-shadow:0 5px 14px rgba(124,58,237,.09);
      color:#6D28D9;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-size:17px;
      font-weight:950;
      line-height:1.35;
      overflow-wrap:break-word;
    }
    .feature-vip-notice-button{
      flex:0 1 235px;
      min-width:0;
      min-height:49px;
      padding:.65rem 1rem;
      border:0;
      border-radius:15px;
      background:linear-gradient(90deg,#3B82F6 0%,#10B981 100%);
      box-shadow:0 6px 15px rgba(16,185,129,.17);
      color:#fff;
      font-size:16px;
      line-height:1.25;
      font-weight:950;
      text-align:center;
      white-space:normal;
    }
    .feature-vip-notice-button:hover{filter:brightness(1.055);box-shadow:0 8px 18px rgba(16,185,129,.23);}
    .feature-vip-notice-button:focus-visible{outline:3px solid #93C5FD;outline-offset:3px;}
    @media (max-width:767px){
      .feature-vip-notice{gap:.5rem;margin:.55rem auto .08rem;}
      .feature-vip-notice-message{flex:1 1 100%;min-height:44px;padding:.62rem .7rem;font-size:16px;}
      .feature-vip-notice-button{flex:1 1 100%;min-height:44px;padding:.6rem .75rem;font-size:16px;}
    }

    /* Trang Liên hệ */
    .contact-page{
      max-width:980px;
      margin:0 auto;
      display:grid;
      gap:.9rem;
    }
    .contact-subtabs{
      width:min(100%,900px);
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:.68rem;
      padding:0;
      border:0;
      border-radius:0;
      background:transparent;
      box-shadow:none;
    }
    .contact-subtab{
      min-height:50px;
      border:1.5px solid;
      border-radius:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:.42rem;
      padding:.55rem .78rem;
      font-size:17px;
      line-height:1.15;
      font-weight:950;
      box-shadow:0 4px 11px rgba(76,29,149,.055);
      transition:transform .15s ease,box-shadow .15s ease,filter .15s ease,border-color .15s ease;
    }
    .contact-subtab:nth-child(1){background:#FFF1F7;border-color:#F9A8D4;color:#BE185D}
    .contact-subtab:nth-child(2){background:#F5F3FF;border-color:#C4B5FD;color:#6D28D9}
    .contact-subtab:nth-child(3){background:#EFF8FF;border-color:#7DD3FC;color:#0369A1}
    .contact-subtab:hover{transform:translateY(-1px);filter:brightness(1.015);box-shadow:0 7px 16px rgba(76,29,149,.10)}
    .contact-subtab.is-active{
      border-width:2px;
      box-shadow:0 0 0 3px rgba(139,92,246,.10),0 7px 17px rgba(76,29,149,.10);
      transform:translateY(-1px);
    }
    .contact-subtab:nth-child(1).is-active{background:#FCE7F3;border-color:#EC4899;color:#BE185D}
    .contact-subtab:nth-child(2).is-active{background:#EDE9FE;border-color:#8B5CF6;color:#6D28D9}
    .contact-subtab:nth-child(3).is-active{background:#E0F2FE;border-color:#38BDF8;color:#0369A1}
    .contact-panel{display:grid;gap:.9rem}
    .contact-intro-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:.7rem;
    }
    .contact-intro-card{
      min-height:142px;
      padding:.9rem;
      border:1px solid;
      border-radius:19px;
      display:flex;
      align-items:flex-start;
      gap:.7rem;
      box-shadow:0 5px 14px rgba(15,23,42,.045);
    }
    .contact-intro-card.tone-purple{background:#FAF5FF;border-color:#D8B4FE;color:#6D28D9}
    .contact-intro-card.tone-pink{background:#FFF1F7;border-color:#F9A8D4;color:#BE185D}
    .contact-intro-card.tone-blue{background:#EFF8FF;border-color:#BAE6FD;color:#0369A1}
    .contact-intro-icon{
      width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.86);font-size:23px;box-shadow:0 3px 8px rgba(76,29,149,.05);
    }
    .contact-intro-card strong{display:block;color:currentColor;font-size:18px;line-height:1.24;font-weight:950}
    .contact-intro-card span:not(.contact-intro-icon){display:block;margin-top:.34rem;color:#667085;font-size:16px;line-height:1.48;font-weight:750}
    button.contact-intro-card{width:100%;font:inherit;text-align:left;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}
    button.contact-intro-card:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(76,29,149,.10);filter:brightness(1.015)}
    .contact-experience-head{display:flex;align-items:flex-end;justify-content:space-between;gap:.75rem;margin-top:.08rem}
    .contact-experience-head h3{margin:0;color:#5B216E;font-size:22px;font-weight:950}
    .contact-experience-head p{margin:.2rem 0 0;color:#667085;font-size:16px;line-height:1.48;font-weight:750}
    .contact-experience-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.72rem}
    .contact-experience-card{min-height:154px;padding:1rem;border:1.5px solid;border-radius:20px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:.82rem;text-align:left;font:inherit;box-shadow:0 5px 14px rgba(15,23,42,.05);transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}
    .contact-experience-card:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(76,29,149,.11);filter:brightness(1.012)}
    .contact-experience-card.games{background:linear-gradient(135deg,#F5F3FF,#FFF1F7);border-color:#C4B5FD;color:#6D28D9}
    .contact-experience-card.tools{background:linear-gradient(135deg,#ECFDF5,#EFF8FF);border-color:#86EFAC;color:#047857}
    .contact-experience-icon{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.88);font-size:29px;box-shadow:0 4px 10px rgba(76,29,149,.06)}
    .contact-experience-copy strong{display:block;color:currentColor;font-size:21px;line-height:1.2;font-weight:950}
    .contact-experience-copy span{display:block;margin-top:.34rem;color:#475467;font-size:16px;line-height:1.48;font-weight:750}
    .contact-experience-go{min-width:30px;height:30px;padding:0 .5rem;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#fff;color:currentColor;font-size:16px;font-weight:950;box-shadow:0 3px 8px rgba(76,29,149,.08)}
    .contact-ee-section{padding:.9rem;border:1px solid #BAE6FD;border-radius:20px;background:linear-gradient(135deg,#F0F9FF,#FAF5FF);box-shadow:0 5px 14px rgba(15,23,42,.045)}
    .contact-ee-section h3{margin:0;color:#0369A1;font-size:22px;font-weight:950}
    .contact-ee-section p{margin:.34rem 0 0;color:#667085;font-size:16px;line-height:1.48;font-weight:750}
    .contact-grade-links{display:flex;flex-wrap:wrap;gap:.48rem;margin-top:.72rem}
    .contact-grade-link{min-height:40px;padding:.46rem .78rem;border:1px solid #BAE6FD;border-radius:12px;background:#fff;color:#0369A1;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.3rem;font-size:16px;font-weight:950;box-shadow:0 3px 8px rgba(14,165,233,.06);transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
    .contact-grade-link:hover{transform:translateY(-1px);background:#EFF8FF;box-shadow:0 5px 12px rgba(14,165,233,.10)}
    .contact-grade-link.is-current{border-color:#C4B5FD;background:#F5F3FF;color:#6D28D9}
    .contact-grade-link.is-unavailable{border-style:dashed;border-color:#CBD5E1;background:#F8FAFC;color:#94A3B8;cursor:default;box-shadow:none}
    .contact-hero{
      display:grid;
      grid-template-columns:72px minmax(0,1fr);
      align-items:center;
      gap:.9rem;
      padding:1rem 1.08rem;
      border:1px solid #DDD6FE;
      border-radius:22px;
      background:linear-gradient(135deg,#FFF7FB 0%,#FAF5FF 48%,#F0F9FF 100%);
      box-shadow:0 7px 18px rgba(76,29,149,.07);

    /* Nền tổng Lớp 1 hòa với vùng trống của ảnh footer.
       Chỉ làm trong suốt các mặt nền cấp module; card/control vẫn giữ màu riêng. */
    #content-stage #class1-math-runtime,
    #content-stage #class1-vietnamese-runtime,
    #content-stage #class1-english-runtime,
    #content-stage #class1-math-runtime #screen-dashboard,
    #content-stage #class1-vietnamese-runtime #screen-dashboard,
    #content-stage #class1-english-runtime #screen-dashboard,
    #content-stage #class1-math-runtime #app-viewport,
    #content-stage #class1-vietnamese-runtime #app-viewport,
    #content-stage #class1-english-runtime #app-viewport,
    #content-stage #class1-math-runtime #view-dashboard-grid,
    #content-stage #class1-vietnamese-runtime #view-dashboard-grid,
    #content-stage #class1-english-runtime #view-dashboard-grid{
      background:transparent!important;

    .section-heading{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:1rem;
      margin:.05rem 0 .85rem;

      font-weight:700;

    .subject-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:.85rem;
    }
    .card-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
      gap:.75rem;
    }
    .home-link-grid{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:.7rem;
    }

    /* Games / Tools ngoài Trang chủ: mỗi mục là một ô nhỏ, không giãn kín cả hàng. */
    .home-feature-grid{
      grid-template-columns:repeat(auto-fill,minmax(220px,260px));
      justify-content:start;
      align-items:stretch;

    .home-feature-grid .home-feature-card .card-desc{min-height:auto;font-size:16px;margin-top:.22rem;}

    .content-card[data-tone="purple"]{background:#FAF5FF;border-color:#E9D5FF;color:#7E22CE}

    .content-stage:has(> .card-grid){

      padding-bottom:0;

      margin-top:0;
    }

    @media (max-width:767px){
      .card-grid .content-card{
        min-height:132px;
        border-radius:19px;
        padding:.78rem .82rem .72rem;
      }
      .card-grid .content-card .card-icon{
        width:39px;height:39px;flex-basis:39px;border-radius:13px;font-size:21px;
      }
      .card-grid .content-card .card-title{font-size:17px;}
      .card-grid .content-card .card-desc{font-size:16px;}
      .content-stage:has(> .card-grid){padding-bottom:0;}

    /* Mobile: chu lon hon + 3 tab moi hang (Trang chu va man hinh mon hoc) */

        grid-auto-columns:auto;

        padding-bottom:2px;
      }
      .nav-tab{
        width:100%;
        min-width:0;
        min-height:64px;
        padding:.42rem .28rem;
        border-radius:15px;
        flex-direction:column;
        gap:.2rem;
        font-size:16px;
        line-height:1.12;

      .nav-tab .tab-icon{font-size:21px}

      .tool-btn{font-size:16px;font-weight:950}
      .install-btn{min-width:82px}

      .section-heading h1{font-size:26px}
      .section-heading p{font-size:16px;line-height:1.42}

      .subject-card{
        min-height:146px;
        padding:1rem;
      }
      .subject-card .card-icon{
        width:48px;height:48px;flex-basis:48px;
        font-size:26px;
      }
      .subject-card .card-title{font-size:22px;line-height:1.18}
      .subject-card .card-desc{font-size:17px;line-height:1.38}
      .subject-card .badge{
        min-height:30px;
        padding:.3rem .65rem;
        font-size:16px;
      }
      .subject-card .arrow{width:34px;height:34px;flex-basis:34px;font-size:18px}

      .subject-profile-card{
        min-height:64px;
        padding:.62rem .72rem;
      }
      .subject-profile-icon{
        width:38px;height:38px;flex-basis:38px;
        font-size:20px;
      }
      .subject-profile-title{font-size:16px}
      .subject-profile-note{font-size:16px}
      .subject-profile-arrow{width:30px;height:30px;flex-basis:30px;font-size:16px}

      .card-grid .content-card .card-title{font-size:18px}
      .card-grid .content-card .card-desc{font-size:16px}
      .card-grid .content-card .badge{font-size:16px}
      .learning-profile-stat strong{font-size:16px}
      .learning-profile-stat span{font-size:16px}
      .learning-profile-empty{font-size:16px}
    }


    /* Tinh chinh co chu desktop/tablet + muc hoc - 2026-10-02 */
    @media (min-width:768px){
      .nav-tab{font-size:17px;line-height:1.1;}
      .nav-tab .tab-icon{font-size:25px;}
      .tool-btn{font-size:16px;}
      .section-heading p{font-size:17px;}

      .subject-card .card-icon{width:56px;height:56px;flex-basis:56px;font-size:31px;}

      .subject-card .card-desc{font-size:18px;line-height:1.38;}
      .subject-card .badge{min-height:29px;padding:.28rem .68rem;font-size:16px;}
      .subject-card .arrow{width:34px;height:34px;flex-basis:34px;font-size:18px;}

      .subject-profile-icon{width:42px;height:42px;flex-basis:42px;font-size:22px;}
      .subject-profile-title{font-size:17px;}
      .subject-profile-note{font-size:16px;}
      .subject-profile-arrow{width:30px;height:30px;flex-basis:30px;font-size:16px;}

      .card-grid .content-card .badge{font-size:16px;}

      .subject-card .card-title{font-size:23px;}
      .subject-card .card-desc{font-size:18px;}
      .subject-card .badge{font-size:16px;}
      .subject-profile-title{font-size:17px;}
      .subject-profile-note{font-size:16px;}
      .card-grid .content-card .card-title{font-size:19px;}
      .card-grid .content-card .card-desc{font-size:16px;}
      .card-grid .content-card .badge{font-size:16px;}

    @media (max-width:767px){
      .account-actions{grid-template-columns:1fr}
      .account-actions .wide{grid-column:auto}
      .account-page{gap:.62rem}
      .account-page-hero{grid-template-columns:58px minmax(0,1fr);padding:.78rem;border-radius:18px}
      .account-page-avatar{width:58px;height:58px;border-radius:18px;font-size:31px}
      .account-page-hero strong{font-size:22px}

      .account-section h2{font-size:18px}
      .account-section p{font-size:16px}
      .account-field-label{font-size:16px}
      .account-access-row strong,.account-request-item strong{font-size:16px}

      .account-avatar-save-row{align-items:stretch;flex-direction:column}
      .account-avatar-save-row .mini-action{width:100%}

      .admin-summary{align-items:stretch;flex-direction:column}.admin-user-tools{justify-content:stretch}.admin-user-tools input,.admin-user-tools select{width:100%;max-width:none}
      .admin-user-row{grid-template-columns:1fr}.admin-user-meta-block{padding-top:.25rem}.admin-subject-row{grid-template-columns:1fr 1fr}.admin-subject-row strong{grid-column:1/-1}

      .admin-request-actions{width:100%;gap:.55rem}.admin-request-actions .mini-action{flex:1;min-width:0}
      .admin-user-head{align-items:flex-start}
      .admin-access-fields-grid,.admin-access-actions-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.admin-access-field label{align-items:flex-start;flex-direction:column;gap:1px}.admin-access-field label small{white-space:normal}
      .auth-card{width:min(96vw,440px);padding:.9rem .9rem 1rem}
    }


    /* Tools/Games card compact: giam khoang trang tren/duoi, giu card gon nhu muc hoc. */
    .card-grid.home-feature-grid .content-card.home-feature-card{
      min-height:92px;
      padding:.48rem .72rem;
      gap:0;
      justify-content:center;
    }
    .card-grid.home-feature-grid .content-card.home-feature-card .card-top{
      align-items:center;
      gap:.62rem;
    }
    .card-grid.home-feature-grid .content-card.home-feature-card .card-title{
      min-height:0;
      font-size:18px;
      line-height:1.16;
    }
    .card-grid.home-feature-grid .content-card.home-feature-card .card-desc{
      min-height:0;
      margin-top:.12rem;
      font-size:16px;
      line-height:1.25;
    }
    @media (max-width:767px){
      .card-grid.home-feature-grid .content-card.home-feature-card{
        min-height:88px;
        padding:.44rem .66rem;
      }
    }

  <div id="auth-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <div class="auth-card">
      <button id="auth-close" class="close-btn" type="button" aria-label="Đóng">×</button>
      <img class="auth-logo" src="logo-home.jpg" alt="Lớp 1">
      <div id="auth-title" class="auth-name">Cô Thỏ Hồng</div>

      <div id="auth-tabs" class="auth-tabs" role="tablist" aria-label="Tài khoản">
        <button id="auth-tab-login" class="auth-tab is-active" type="button">Đăng nhập</button>
        <button id="auth-tab-register" class="auth-tab" type="button">Đăng ký tài khoản</button>
      </div>

      <form id="login-form" class="form-stack" novalidate>
        <div class="field">
          <label for="login-id">Mã ID</label>
          <input id="login-id" name="login-id" autocomplete="username" placeholder="Ví dụ: L1-A001">
        </div>
        <div class="field">
          <label for="login-password">Mật khẩu</label>
          <input id="login-password" name="login-password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu">
        </div>
        <button id="login-submit" class="primary-action" type="submit">Đăng nhập</button>
      </form>

      <form id="register-form" class="form-stack hidden" novalidate>
        <div class="field">
          <label for="register-name">Họ và tên học sinh</label>
          <input id="register-name" name="register-name" autocomplete="name" placeholder="Ví dụ: Nguyễn Minh An">
        </div>
        <div class="field">
          <label for="register-password">Mật khẩu <span aria-hidden="true">*</span></label>
          <input id="register-password" name="register-password" type="password" minlength="6" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự">
        </div>
        <div class="field">
          <label for="register-confirm">Nhập lại mật khẩu <span aria-hidden="true">*</span></label>
          <input id="register-confirm" name="register-confirm" type="password" minlength="6" autocomplete="new-password" placeholder="Nhập lại mật khẩu">
        </div>
        <button id="register-submit" class="primary-action" type="submit">Đăng ký ngay</button>
      </form>

      <div class="auth-divider"></div>
      <button id="auth-later" class="secondary-action" type="button">Để sau nhé</button>
    </div>
  </div>

  <div id="app-dialog" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="dialog-card">
      <div id="dialog-icon" class="dialog-icon">🐰</div>
      <h3 id="dialog-title">Thông báo</h3>
      <p id="dialog-message"></p>
      <div class="dialog-actions">
        <button id="dialog-secondary" class="secondary-action hidden" type="button"></button>
        <button id="dialog-ok" class="primary-action" type="button">OK</button>
      </div>
    </div>
