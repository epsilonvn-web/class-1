<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Bắt lời mời cài PWA càng sớm càng tốt để nút Cài App không bỏ lỡ sự kiện của Chromium.
    window.__class1InstallPrompt = null;
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      window.__class1InstallPrompt = event;
      window.dispatchEvent(new Event("class1-install-ready"));
    });
    window.addEventListener("appinstalled", () => {
      window.__class1InstallPrompt = null;
    });
  </script>
  <link rel="manifest" href="manifest.json?v=class1-core-8">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Lớp 1 - Cô Thỏ Hồng | Epsilon Edu</title>
  <style>
    :root{
      --page:#FFFFFF;
      --white:#FFFFFF;
      --ink:#344054;
      --muted:#667085;
      --pink:#EC4899;
      --pink-2:#F472B6;
      --purple:#8B5CF6;
      --purple-2:#7C3AED;
      --blue:#3B82F6;
      --sky:#38BDF8;
      --green:#10B981;
      --teal:#14B8A6;
      --amber:#F59E0B;
      --red:#F43F5E;
      --brand:#173A78;
      --line:#EDE9FE;
      --shadow:0 7px 18px rgba(76,29,149,.10);
      --radius:18px;
      --app-width:82rem;
    }

    *{box-sizing:border-box}
    html{background:var(--page);scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:var(--page);
      color:var(--ink);
      font-family:"Nunito","Segoe UI",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button,input{font:inherit}
    button{cursor:pointer}
    img{max-width:100%}
    .hidden{display:none!important}

    .app-shell{
      width:min(100%,var(--app-width));
      margin:0 auto;
      padding:0 .5rem max(.25rem,env(safe-area-inset-bottom));
    }

    .app-header{
      display:grid;
      grid-template-columns:112px minmax(0,1fr) auto;
      align-items:stretch;
      gap:.55rem;
      padding:.45rem 0;
      position:relative;
      z-index:20;
      background:var(--page);
    }

    .home-btn{
      width:112px;
      height:74px;
      border:1px solid #E9D5FF;
      border-radius:17px;
      padding:0;
      overflow:hidden;
      background:#fff;
      box-shadow:var(--shadow);
      transition:transform .18s ease, box-shadow .18s ease;
    }
    .home-btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(139,92,246,.18)}
    .home-btn img{width:100%;height:100%;object-fit:cover;display:block}

    .primary-nav{
      min-width:0;
      display:grid;
      grid-auto-flow:column;
      grid-auto-columns:minmax(96px,1fr);
      gap:.45rem;
      overflow-x:auto;
      scrollbar-width:none;
      align-items:stretch;
    }
    .primary-nav::-webkit-scrollbar{display:none}

    .nav-tab{
      position:relative;
      min-width:0;
      min-height:74px;
      padding:.5rem .42rem;
      border:1px solid;
      border-radius:17px;
      box-shadow:0 3px 10px rgba(15,23,42,.05);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:.22rem;
      font-weight:900;
      font-size:15px;
      line-height:1.08;
      text-align:center;
      transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
      white-space:normal;
    }
    .nav-tab:hover{transform:translateY(-1px);filter:brightness(1.01);box-shadow:0 7px 17px rgba(76,29,149,.10)}
    .nav-tab .tab-icon{font-size:22px;line-height:1}
    .nav-tab::after{
      content:"";
      position:absolute;
      left:30%;right:30%;bottom:-5px;height:3px;border-radius:99px;
      background:currentColor;opacity:0;transform:scaleX(.5);transition:.16s ease;
    }
    .nav-tab.is-active::after{opacity:1;transform:scaleX(1)}
    .nav-tab.is-active{color:white!important;border-color:transparent!important}
    .nav-tab.is-locked:not(.is-active)::before{content:"🔒";position:absolute;right:7px;top:6px;font-size:11px;opacity:.72}

    .tone-purple{background:#F3E8FF;color:#7C3AED;border-color:#DDD6FE}
    .tone-purple.is-active{background:linear-gradient(90deg,#A855F7,#7C3AED)}
    .tone-pink{background:#FCE7F3;color:#DB2777;border-color:#FBCFE8}
    .tone-pink.is-active{background:linear-gradient(90deg,#F472B6,#EC4899)}
    .tone-blue{background:#E0F2FE;color:#0369A1;border-color:#BAE6FD}
    .tone-blue.is-active{background:linear-gradient(90deg,#38BDF8,#0284C7)}
    .tone-amber{background:#FEF3C7;color:#B45309;border-color:#FDE68A}
    .tone-amber.is-active{background:linear-gradient(90deg,#FBBF24,#F59E0B)}
    .tone-green{background:#DCFCE7;color:#15803D;border-color:#BBF7D0}
    .tone-green.is-active{background:linear-gradient(90deg,#4ADE80,#16A34A)}
    .tone-indigo{background:#EDE9FE;color:#6D28D9;border-color:#DDD6FE}
    .tone-indigo.is-active{background:linear-gradient(90deg,#8B5CF6,#6D28D9)}

    .header-tools{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:.4rem;
    }
    .tool-btn{
      height:42px;
      border:1px solid #E9D5FF;
      background:#fff;
      color:#6D28D9;
      border-radius:14px;
      box-shadow:0 3px 9px rgba(76,29,149,.07);
      font-weight:900;
      padding:0 .7rem;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:.35rem;
      white-space:nowrap;
    }
    .tool-btn:not(.install-btn):hover{background:#FAF5FF}
    .install-btn{
      color:white;
      border:0;
      background:linear-gradient(90deg,var(--pink),var(--purple));
      min-width:86px;
      transition:filter .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .install-btn:hover{
      color:white;
      background:linear-gradient(90deg,var(--pink),var(--purple));
      filter:brightness(1.12) saturate(1.08);
      box-shadow:0 6px 16px rgba(168,85,247,.28);
      transform:translateY(-1px);
    }
    .user-btn{
      width:auto;
      min-width:96px;
      max-width:180px;
      height:74px;
      padding:.42rem .68rem;
      border-radius:17px;
      flex-direction:column;
      gap:.18rem;
      background:#FAF5FF;
      color:#7C3AED;
      border-color:#DDD6FE;
      line-height:1.05;
      overflow:hidden;
    }
    .user-btn:hover{background:#F3E8FF!important;transform:translateY(-1px);box-shadow:0 7px 17px rgba(76,29,149,.10)}
    .user-btn-avatar{display:block;font-size:24px;line-height:1;flex:0 0 auto}
    .user-btn-name{
      display:block;
      width:100%;
      max-width:100%;
      overflow:visible;
      text-overflow:clip;
      white-space:normal;
      overflow-wrap:anywhere;
      font-size:13px;
      font-weight:950;
      color:currentColor;
      text-align:center;
    }
    .score-box{
      height:50px;
      padding:.24rem .54rem;
      border:1px solid #FBCFE8;
      border-radius:17px;
      background:#FFF7FB;
      display:grid;
      grid-template-columns:auto auto;
      gap:.06rem .5rem;
      align-content:center;
      box-shadow:0 3px 9px rgba(236,72,153,.06);
      font-size:13px;
      font-weight:900;
    }
    .score-box .good{color:#059669}
    .score-box .bad{color:#E11D48}
    .score-box strong{font-size:16px}

    .banner-slot{width:100%;position:relative}
    .main-banner{
      width:100%;
      aspect-ratio:5.5/1;
      overflow:hidden;
      background:#EAF8FF;
    }
    .main-banner picture,.main-banner img{width:100%;height:100%;display:block}
    .main-banner img{object-fit:cover}

    .sub-banner{
      width:100%;
      aspect-ratio:15/1;
      position:relative;
      overflow:hidden;
      background:url("banner-sub.jpg") center/cover no-repeat;
      display:flex;
      align-items:center;
      padding:0 1.25rem;
    }
    .sub-pill{
      position:relative;
      z-index:1;
      min-width:200px;
      max-width:46%;
      min-height:38px;
      padding:.48rem 1rem;
      border-radius:999px;
      border:1px solid rgba(244,114,182,.42);
      background:rgba(255,255,255,.84);
      backdrop-filter:blur(5px);
      box-shadow:0 4px 14px rgba(76,29,149,.10);
      color:#BE185D;
      font-weight:900;
      font-size:15px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .content-stage{
      position:relative;
      z-index:3;
      min-height:340px;
      padding:1rem .1rem 2.2rem;
    }
    .section-heading{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:1rem;
      margin:.05rem 0 .85rem;
    }
    .section-heading h1{
      margin:0;
      color:#5B216E;
      font-size:clamp(24px,2.2vw,31px);
      line-height:1.08;
      font-weight:950;
      letter-spacing:-.02em;
    }
    .section-heading p{
      margin:.3rem 0 0;
      color:var(--muted);
      font-size:15px;
      line-height:1.45;
      font-weight:700;
    }

    .subject-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:.85rem;
    }
    .card-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
      gap:.75rem;
    }
    .home-link-grid{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:.7rem;
    }

    .content-card{
      position:relative;
      min-height:126px;
      border:1px solid;
      border-radius:18px;
      padding:1rem 1rem .92rem;
      box-shadow:0 5px 13px rgba(15,23,42,.05);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:.55rem;
      text-align:left;
      overflow:hidden;
      transition:transform .16s ease, box-shadow .16s ease;
    }
    button.content-card:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(76,29,149,.10)}
    .content-card[data-tone="pink"]{background:#FFF1F7;border-color:#FBCFE8;color:#BE185D}
    .content-card[data-tone="purple"]{background:#FAF5FF;border-color:#E9D5FF;color:#7E22CE}
    .content-card[data-tone="blue"]{background:#EFF8FF;border-color:#BAE6FD;color:#0369A1}
    .content-card[data-tone="green"]{background:#ECFDF5;border-color:#BBF7D0;color:#047857}
    .content-card[data-tone="amber"]{background:#FFFBEB;border-color:#FDE68A;color:#A16207}
    .content-card[data-tone="teal"]{background:#F0FDFA;border-color:#99F6E4;color:#0F766E}

    .card-top{display:flex;align-items:flex-start;gap:.65rem;min-width:0}
    .card-icon{
      width:42px;height:42px;flex:0 0 42px;border-radius:14px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.72);
      border:1px solid rgba(255,255,255,.85);
      font-size:23px;
    }
    .card-copy{min-width:0;flex:1}
    .card-title{
      margin:0;
      font-size:18px;
      line-height:1.22;
      font-weight:950;
      color:currentColor;
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:2;
      overflow:hidden;
      min-height:2.44em;
    }
    .card-desc{
      margin:.34rem 0 0;
      font-size:16px;
      line-height:1.38;
      font-weight:700;
      color:#475467;
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:2;
      overflow:hidden;
      min-height:2.76em;
    }
    .card-foot{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:.5rem;
      min-height:28px;
    }
    .badge{
      display:inline-flex;align-items:center;gap:.25rem;
      min-height:26px;padding:.25rem .55rem;
      border:1px solid currentColor;border-radius:999px;
      background:rgba(255,255,255,.62);
      font-size:12px;font-weight:900;
    }
    .arrow{
      width:30px;height:30px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      color:#fff;background:var(--accent,#7C3AED);
      font-size:16px;font-weight:950;flex:0 0 30px;
    }
    .arrow span{color:#fff}
    .subject-card{min-height:160px;padding:1.15rem}
    .subject-card .card-icon{width:52px;height:52px;flex-basis:52px;font-size:29px}
    .subject-card .card-title{font-size:21px;min-height:auto}
    .subject-card .card-desc{font-size:16px}

    /* Hồ sơ học tập đặt ngay dưới từng môn ở Trang chủ */
    .subject-column{
      display:flex;
      flex-direction:column;
      gap:.58rem;
      min-width:0;
    }
    .subject-column > .subject-card{width:100%;}
    .subject-profile-card{
      width:100%;
      min-height:62px;
      border:1px solid;
      border-radius:16px;
      padding:.62rem .72rem;
      display:flex;
      align-items:center;
      gap:.62rem;
      text-align:left;
      cursor:pointer;
      box-shadow:0 4px 11px rgba(15,23,42,.045);
      transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;
    }
    .subject-profile-card:hover{
      transform:translateY(-1px);
      box-shadow:0 7px 17px rgba(76,29,149,.09);
      filter:brightness(1.025);
    }
    .subject-profile-card[data-tone="blue"]{background:#F5FBFF;border-color:#BAE6FD;color:#0369A1}
    .subject-profile-card[data-tone="pink"]{background:#FFF7FB;border-color:#FBCFE8;color:#BE185D}
    .subject-profile-card[data-tone="green"]{background:#F5FFF9;border-color:#BBF7D0;color:#047857}
    .subject-profile-icon{
      width:38px;height:38px;flex:0 0 38px;border-radius:13px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.88);
      box-shadow:0 3px 8px rgba(76,29,149,.06);
      font-size:20px;
    }
    .subject-profile-copy{min-width:0;flex:1;}
    .subject-profile-title{display:block;font-size:15px;line-height:1.15;font-weight:950;color:currentColor;}
    .subject-profile-note{
      display:block;margin-top:.18rem;font-size:11.5px;line-height:1.18;font-weight:800;color:#64748B;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .subject-profile-arrow{
      width:27px;height:27px;flex:0 0 27px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#A855F7,#7C3AED);
      color:#fff;font-size:14px;font-weight:950;
      box-shadow:0 4px 9px rgba(124,58,237,.18);
    }

    .learning-profile-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:.7rem;
      margin-top:.15rem;
    }
    .learning-profile-stat{
      min-height:108px;
      border:1px solid #E9D5FF;
      border-radius:18px;
      background:rgba(255,255,255,.74);
      padding:.85rem;
      box-shadow:0 4px 12px rgba(76,29,149,.045);
    }
    .learning-profile-stat .stat-icon{font-size:23px;}
    .learning-profile-stat strong{display:block;margin-top:.35rem;color:#5B216E;font-size:14px;}
    .learning-profile-stat span{display:block;margin-top:.3rem;color:#64748B;font-size:13px;font-weight:800;line-height:1.3;}
    .learning-profile-empty{
      margin-top:.75rem;
      border:1px dashed #D8B4FE;
      border-radius:18px;
      background:linear-gradient(135deg,rgba(253,242,248,.78),rgba(245,243,255,.78));
      padding:1.1rem;
      text-align:center;
      color:#64748B;
      font-weight:800;
      line-height:1.45;
    }
    .learning-profile-empty strong{display:block;color:#7C3AED;font-size:18px;margin-bottom:.28rem;}

    .empty-panel{
      border:1px dashed #D8B4FE;
      background:rgba(255,255,255,.64);
      border-radius:20px;
      min-height:220px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:2rem 1rem;
      color:#6B7280;
    }
    .empty-panel strong{display:block;color:#7C3AED;font-size:20px;margin-bottom:.35rem}

    .detail-panel{
      background:rgba(255,255,255,.68);
      border:1px solid #E9D5FF;
      border-radius:20px;
      padding:1rem;
      box-shadow:0 5px 15px rgba(76,29,149,.05);
    }
    .back-btn{
      border:0;
      background:linear-gradient(90deg,#EC4899,#8B5CF6);
      color:#fff;
      border-radius:14px;
      min-height:42px;
      padding:0 .95rem;
      font-weight:900;
      box-shadow:0 5px 12px rgba(139,92,246,.18);
    }

    .app-footer{
      position:relative;
      z-index:1;
      width:100%;
      aspect-ratio:7/1;
      margin:-1.05rem auto 0;
      background:url("footer-bg.jpg") center/cover no-repeat;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:0 1rem;
      pointer-events:none;
    }
    .footer-copy{
      color:#0000FF;
      text-shadow:0 1px 0 rgba(255,255,255,.98);
      transform:translateY(-7px);
      line-height:1.25;
      font-weight:900;
      font-size:14px;
    }
    .footer-copy small{display:block;font-size:11px;margin-top:.16rem}

    .modal-backdrop{
      position:fixed;inset:0;z-index:100;
      background:rgba(30,41,59,.48);
      backdrop-filter:blur(6px);
      display:flex;align-items:center;justify-content:center;
      padding:1rem;
    }
    .auth-card{
      width:min(94vw,440px);
      max-height:94vh;
      overflow-y:auto;
      background:#fff;
      border:1px solid #F9A8D4;
      border-radius:28px;
      box-shadow:0 24px 70px rgba(76,29,149,.26);
      padding:1rem 1.1rem 1.2rem;
      position:relative;
    }
    .close-btn{
      position:absolute;right:14px;top:14px;
      width:36px;height:36px;border-radius:50%;
      border:1px solid #FBCFE8;background:#FFF1F7;color:#EC4899;
      font-size:21px;font-weight:900;
    }
    .auth-logo{display:block;width:240px;max-width:72%;margin:.45rem auto .35rem;border-radius:18px}
    .auth-name{text-align:center;color:#EC4899;font-size:19px;font-weight:950;margin:.2rem 0 1rem}
    .auth-tabs{
      display:grid;grid-template-columns:1fr 1fr;
      padding:4px;border:1px solid #FBCFE8;border-radius:16px;background:#FFF1F7;
      margin-bottom:1rem;
    }
    .auth-tab{
      min-height:40px;border:0;border-radius:12px;background:transparent;
      color:#98A2B3;font-weight:900;
    }
    .auth-tab.is-active{background:#fff;color:#EC4899;box-shadow:0 2px 7px rgba(76,29,149,.07)}
    .form-stack{display:grid;gap:.78rem}
    .field label{display:block;margin:0 0 .32rem;color:#DB2777;font-size:13px;font-weight:900}
    .field input{
      width:100%;height:48px;border-radius:15px;border:1.5px solid #F9A8D4;
      background:#FFF9FC;color:#344054;padding:0 .85rem;outline:none;font-weight:800;
    }
    .field input:focus{border-color:#A855F7;box-shadow:0 0 0 3px rgba(168,85,247,.10)}
    .primary-action{
      width:100%;min-height:48px;border:0;border-radius:15px;color:#fff;
      background:linear-gradient(90deg,#EC4899,#8B5CF6);
      font-weight:950;box-shadow:0 6px 14px rgba(139,92,246,.22);
      display:flex;align-items:center;justify-content:center;gap:.5rem;
    }
    .primary-action:disabled{opacity:.7;cursor:wait}
    .secondary-action{
      width:100%;min-height:46px;border:1px solid #E9D5FF;border-radius:15px;
      color:#7C3AED;background:linear-gradient(90deg,#FDF2F8,#F5F3FF);
      font-weight:900;
    }
    .auth-divider{height:1px;background:#FCE7F3;margin:1rem 0}
    .account-panel,.access-request-panel{display:grid;gap:.75rem}
    .account-identity{
      display:grid;grid-template-columns:56px minmax(0,1fr);gap:.7rem;align-items:center;
      padding:.75rem;border:1px solid #FBCFE8;border-radius:18px;background:linear-gradient(135deg,#FFF7FB,#FAF5FF);
    }
    .account-avatar{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #E9D5FF;font-size:30px;box-shadow:0 4px 12px rgba(76,29,149,.08)}
    .account-identity strong{display:block;color:#5B216E;font-size:17px;line-height:1.2}
    .account-identity span{display:block;margin-top:.2rem;color:#667085;font-size:13px;font-weight:900;user-select:text}
    .account-subtitle{margin:.15rem 0 0;color:#7C3AED;font-size:13px;font-weight:950}
    .account-access-list,.account-requests{display:grid;gap:.45rem}
    .account-access-row,.account-request-item{

      .card-grid .content-card .card-icon{width:48px;height:48px;flex-basis:48px;font-size:27px;}
      .card-grid .content-card .card-title{font-size:21px;}
      .card-grid .content-card .card-desc{font-size:17px;}
      .card-grid .content-card .badge{font-size:13.5px;}

      .footer-copy{font-size:16px;}
      .footer-copy small{font-size:12px;}
    }

    @media (max-width:767px){
      .nav-tab{font-size:16px;}
      .nav-tab .tab-icon{font-size:23px;}
      .subject-card .card-title{font-size:23px;}
      .subject-card .card-desc{font-size:18px;}
      .subject-card .badge{font-size:15px;}
      .subject-profile-title{font-size:17px;}
      .subject-profile-note{font-size:14px;}
      .card-grid .content-card .card-title{font-size:19px;}
      .card-grid .content-card .card-desc{font-size:16px;}
      .card-grid .content-card .badge{font-size:14px;}
      .footer-copy{font-size:13px;}
      .footer-copy small{font-size:10.5px;}
    }


    @media (max-width:767px){
      .account-actions{grid-template-columns:1fr}
      .account-actions .wide{grid-column:auto}
      .account-page{gap:.62rem}
      .account-page-hero{grid-template-columns:58px minmax(0,1fr);padding:.78rem;border-radius:18px}
      .account-page-avatar{width:58px;height:58px;border-radius:18px;font-size:31px}
      .account-page-hero strong{font-size:20px}
      .account-hero-name-row{align-items:flex-start}
      .account-id-row{align-items:flex-start}
      .account-page-grid{grid-template-columns:1fr}
      .account-section{padding:.75rem;border-radius:17px}
      .account-inline-control{grid-template-columns:1fr auto}
      .account-page-actions{grid-template-columns:1fr}
      .admin-stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .admin-request-card{align-items:flex-start;flex-direction:column}
      .admin-request-actions{width:100%}.admin-request-actions .mini-action{flex:1}
      .admin-user-head{align-items:flex-start}
      .admin-access-control,.admin-reset-control{grid-template-columns:72px minmax(0,1fr) 62px}
      .auth-card{width:min(96vw,440px);padding:.9rem .9rem 1rem}
    }

  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header" aria-label="Điều hướng chính">
      <button id="home-button" class="home-btn" type="button" title="Về Trang chủ Lớp 1">
        <img src="logo-home.jpg" alt="Lớp 1 - Trang chủ">
      </button>

      <nav id="primary-nav" class="primary-nav" aria-label="Các tab chính"></nav>

      <div class="header-tools">
        <button id="install-button" class="tool-btn install-btn hidden" type="button">Cài App</button>
        <div id="score-box" class="score-box hidden" aria-label="Thống kê đúng sai">
          <span class="good">★ Đúng</span><strong class="good">0</strong>
          <span class="bad">★ Sai</span><strong class="bad">0</strong>
        </div>
        <button id="account-button" class="tool-btn user-btn" type="button" title="Tài khoản" aria-label="Tài khoản"><span class="user-btn-avatar" aria-hidden="true">👤</span><span class="user-btn-name">Tài khoản</span></button>
      </div>
    </header>

    <section class="banner-slot" aria-label="Không gian nhận diện">
      <div id="main-banner" class="main-banner">
        <picture>
          <source media="(max-width: 767px)" srcset="banner-main-mobile.jpg">
          <img src="banner-main.jpg" alt="Lớp 1 - Cô Thỏ Hồng">
        </picture>
      </div>
      <div id="sub-banner" class="sub-banner hidden">
        <div id="sub-pill" class="sub-pill">🌸 Mục học</div>
      </div>
    </section>

    <main id="content-stage" class="content-stage" tabindex="-1"></main>

    <footer class="app-footer" aria-label="Chân trang">
      <div class="footer-copy">
        Epsilon Edu - Tiến bộ từng ngày
        <small><span aria-hidden="true">📱</span> 0865.749.402</small>
      </div>
    </footer>
  </div>

  <div id="auth-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <div class="auth-card">
      <button id="auth-close" class="close-btn" type="button" aria-label="Đóng">×</button>
      <img class="auth-logo" src="logo-home.jpg" alt="Lớp 1">
      <div id="auth-title" class="auth-name">Cô Thỏ Hồng</div>

      <div id="auth-tabs" class="auth-tabs" role="tablist" aria-label="Tài khoản">
        <button id="auth-tab-login" class="auth-tab is-active" type="button">Đăng nhập</button>
        <button id="auth-tab-register" class="auth-tab" type="button">Đăng ký tài khoản</button>
      </div>

      <form id="login-form" class="form-stack" novalidate>
        <div class="field">
          <label for="login-id">Mã ID</label>
          <input id="login-id" name="login-id" autocomplete="username" placeholder="Ví dụ: L1-A001">
        </div>
        <div class="field">
          <label for="login-password">Mật khẩu</label>
          <input id="login-password" name="login-password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu">
        </div>
        <button id="login-submit" class="primary-action" type="submit">Đăng nhập</button>
      </form>

      <form id="register-form" class="form-stack hidden" novalidate>
        <div class="field">
          <label for="register-name">Họ và tên học sinh</label>
          <input id="register-name" name="register-name" autocomplete="name" placeholder="Ví dụ: Nguyễn Minh An">
        </div>
        <div class="field">
          <label for="register-password">Mật khẩu <span aria-hidden="true">*</span></label>
          <input id="register-password" name="register-password" type="password" minlength="6" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự">
        </div>
        <div class="field">
          <label for="register-confirm">Nhập lại mật khẩu <span aria-hidden="true">*</span></label>
          <input id="register-confirm" name="register-confirm" type="password" minlength="6" autocomplete="new-password" placeholder="Nhập lại mật khẩu">
        </div>
        <button id="register-submit" class="primary-action" type="submit">Đăng ký ngay</button>
      </form>

      <div class="auth-divider"></div>
      <button id="auth-later" class="secondary-action" type="button">Để sau nhé</button>
    </div>
  </div>

  <div id="app-dialog" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="dialog-card">
      <div id="dialog-icon" class="dialog-icon">🐰</div>
      <h3 id="dialog-title">Thông báo</h3>
      <p id="dialog-message"></p>
      <div class="dialog-actions">
        <button id="dialog-secondary" class="secondary-action hidden" type="button"></button>
        <button id="dialog-ok" class="primary-action" type="button">OK</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>

  <script src="assets/js/app.js?v=class1-account-3"></script>
</body>
</html>
